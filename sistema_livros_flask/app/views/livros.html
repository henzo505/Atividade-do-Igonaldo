{% extends "base.html" %}{% block content %}<h1>Meus livros</h1><form method="POST"><label>Título</label><input name="titulo" maxlength="120" required><label>Autor</label><input name="autor" maxlength="80" required><button>Cadastrar livro</button></form><form method="GET"><input name="q" placeholder="Buscar título ou autor" value="{{ busca }}"><button>Buscar</button></form><h2>Listagem</h2>{% for livro in livros %}<article><strong>{{ livro.titulo }}</strong> — {{ livro.autor }} <a href="{{ url_for('livros.editar',id=livro.id) }}">Editar</a><form class="inline" method="POST" action="{{ url_for('livros.excluir',id=livro.id) }}"><button class="danger">Excluir</button></form></article>{% else %}<p>Nenhum livro encontrado.</p>{% endfor %}{% endblock %}
