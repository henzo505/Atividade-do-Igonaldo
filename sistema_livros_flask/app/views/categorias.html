{% extends "base.html" %}{% block content %}<h1>Minhas categorias</h1><form method="POST"><label>Nome</label><input name="nome" maxlength="60" required><label>Descrição</label><input name="descricao" maxlength="200"><button>Cadastrar categoria</button></form><form method="GET"><input name="q" placeholder="Buscar categoria" value="{{ busca }}"><button>Buscar</button></form>{% for c in categorias %}<article><strong>{{ c.nome }}</strong> — {{ c.descricao }} <a href="{{ url_for('categorias.editar',id=c.id) }}">Editar</a><form class="inline" method="POST" action="{{ url_for('categorias.excluir',id=c.id) }}"><button class="danger">Excluir</button></form></article>{% else %}<p>Nenhuma categoria encontrada.</p>{% endfor %}{% endblock %}
