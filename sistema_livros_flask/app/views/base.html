<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sistema de Livros</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><nav><a href="{{ url_for('main.home') }}">Início</a><a href="{{ url_for('livros.listar') }}">Livros</a><a href="{{ url_for('categorias.listar') }}">Categorias</a><span class="right">{{ session.get('username','') }}</span><a href="{{ url_for('auth.logout') }}">Sair</a></nav><main class="caixa">{% with mensagens=get_flashed_messages(with_categories=true) %}{% if mensagens %}{% for categoria,mensagem in mensagens %}<p class="mensagem {{ categoria }}">{{ mensagem }}</p>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
